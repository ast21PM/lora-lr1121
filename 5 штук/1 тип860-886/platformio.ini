; ==============================================================================
; ELRS DISARM System — LilyGO T3-S3 (LR1121)
; Протокол: ExpressLRS 100Hz / 900MHz FCC
; Роли: PILOT | DRONE | AGGRESSOR | MONITOR
; ==============================================================================

[platformio]
default_envs = T3_S3_Monitor
description = ELRS DISARM System — 900MHz FCC, 100Hz

; ==============================================================================
; БАЗОВАЯ КОНФИГУРАЦИЯ — общая для всех ролей
; ==============================================================================
[env]
platform = espressif32
board = lilygo-t3-s3
framework = arduino

; --- Монитор порта ---
monitor_speed = 115200
monitor_filters = printable, time
upload_speed = 921600

; --- Железо ESP32-S3 ---
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB    

; --- Библиотеки ---
lib_deps =
    jgromes/RadioLib@^7.1.2
    olikraus/U8g2@^2.35.30

; --- Флаги сборки ---
build_flags =
    ; ESP32-S3 USB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

    ; -------------------------------------------------------
    ; ПАРАМЕТРЫ МОДУЛЯЦИИ — ELRS 100Hz / 900MHz FCC
    ; SF6 + BW500: ToA = 1.7мс, укладывается в интервал 10мс
    ; -------------------------------------------------------
    -DCONFIG_RADIO_FREQ=860.0
    -DCONFIG_RADIO_BW=500.0
    -DCONFIG_RADIO_SF=6
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=6


    -DFHSS_CHANNELS=40
    -DFHSS_BASE_FREQ=860.5f
    -DFHSS_STEP_FREQ=0.75f
    -DFHSS_RENDEZVOUS_IDX=0

    ; -------------------------------------------------------
    ; BINDING PHRASE — одинакова для ВСЕХ плат
    ; Агрессор знает фразу → та же FHSS таблица → синхронизация
    ; -------------------------------------------------------
    -DBINDING_PHRASE=\"TEST11\"

    ; Пути к заголовкам
    -I include
    -I lib/ELRS/src

; ==============================================================================
; РОЛЬ 1: ПИЛОТ (TX)
; Основной передатчик RC команд. ARM/DISARM через кнопку BOOT.
; ID = 0xBB — дрон использует его для верификации источника.
; ==============================================================================
[env:T3_S3_Pilot]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_PILOT
    -DCONFIG_RADIO_OUTPUT_POWER=22
    -DTX_INTERVAL_MS=10
    -DDEVICE_ID=0xBB

; ==============================================================================
; РОЛЬ 2: ДРОН (RX)
; Слушает пилота по FHSS. Дизармируется если агрессор ближе физически.
; PILOT_ID — ID которому доверяет дрон.
; ==============================================================================
[env:T3_S3_Drone]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_DRONE
    -DCONFIG_RADIO_OUTPUT_POWER=22
    -DTX_INTERVAL_MS=10
    -DPILOT_ID=0xBB
    -DDISARM_THRESHOLD=1
    -DRX_WINDOW_EXTRA_MS=30
    -DSYNC_TIMEOUT_MS=2000
    -DRSSI_MARGIN_DB=-999.0f
; ==============================================================================
; РОЛЬ 3: АГРЕССОР (TX+RX полудуплекс)
; Слушает TX_SLOT_OFFSET_MS → ловит пакет пилота → берёт его fhssIndex
; → передаёт DISARM на том же канале.
;
; TX_SLOT_OFFSET_MS = 5мс:
;   - больше ToA пилота (1.7мс) — успеваем поймать пакет
;   - меньше TX_INTERVAL_MS (10мс) — успеваем передать до следующего цикла
; ==============================================================================
[env:T3_S3_Aggressor]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_AGGRESSOR
    -DCONFIG_RADIO_OUTPUT_POWER=22
    -DTX_INTERVAL_MS=10
    -DTX_SLOT_OFFSET_MS=5
    -DDEVICE_ID=0xAA

; ==============================================================================
; РОЛЬ 4: МОНИТОР (RX пассивный)
; Сканирует все каналы, логирует все пакеты (пилот + агрессор).
; Расширенное окно 150мс — гарантирует приём обоих источников.
; ==============================================================================
[env:T3_S3_Monitor]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_MONITOR
    -DCONFIG_RADIO_OUTPUT_POWER=16
    -DTX_INTERVAL_MS=10
    -DRX_WINDOW_EXTRA_MS=150
