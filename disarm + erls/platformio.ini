[platformio]
default_envs = T3_S3_Monitor
description = LoRa ELRS Simulation System v4.9 - Aggressor FHSS Sync

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = printable, time
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
lib_deps =
    jgromes/RadioLib@^7.1.2
    olikraus/U8g2@^2.35.30

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_RADIO_FREQ=868.0
    -DCONFIG_RADIO_BW=500.0
    ; SF7/BW500/CR5: ToA ≈ 2мс, TX_INTERVAL=20мс → 50 Гц (стандарт ELRS)
    -DCONFIG_RADIO_SF=7
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=6
    ; Binding phrase одинакова для ВСЕХ ролей.
    ; Агрессор знает фразу → та же FHSS таблица → синхронизация с пилотом.
    -DBINDING_PHRASE=\"SECRET_PILOT_2026\"

; ============================================================
; РОЛЬ 1: ПИЛОТ
; 22 dBm — сильнее агрессора по умолчанию.
; Дрон слушает пилота пока агрессор не ближе физически.
; ============================================================
[env:T3_S3_Pilot]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_PILOT
    -DCONFIG_RADIO_OUTPUT_POWER=22
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=0
    -DDEVICE_ID=0xBB

; ============================================================
; РОЛЬ 2: ДРОН
; Только RX — мощность TX не важна, ставим минимум.
; PILOT_ID=0xBB — ID пилота для binding верификации.
; ============================================================
[env:T3_S3_Drone]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_DRONE
    -DCONFIG_RADIO_OUTPUT_POWER=10
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=0
    -DPILOT_ID=0xBB

; ============================================================
; РОЛЬ 3: АГРЕССОР (v4.9 — полудуплекс)
; Логика каждого цикла (~20мс):
;   [0..TX_SLOT_OFFSET_MS=10мс] — слушаем канал, ловим пакет пилота
;   [10..12мс]                  — передаём DISARM на том же канале
;   [12мс+]                     — прыгаем на следующий канал пилота
;
; TX_SLOT_OFFSET_MS здесь = длина окна прослушки (не просто сдвиг!).
; Должно быть меньше TX_INTERVAL_MS и больше ToA (~2мс).
; 10мс — оптимально: успеваем поймать пилота и передать до RX_WINDOW дрона.
;
; Мощность 18 dBm — для стендового теста (все платы рядом).
; Атака срабатывает когда агрессор физически ближе к дрону чем пилот.
; Чтобы демонстрировать защиту: пилот 22dBm, агрессор 18dBm →
; поднести агрессор вплотную к дрону (5-10 см) — RSSI агрессора победит.
; ============================================================
[env:T3_S3_Aggressor]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_AGGRESSOR
    -DCONFIG_RADIO_OUTPUT_POWER=18
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=10
    -DDEVICE_ID=0xAA

; ============================================================
; РОЛЬ 4: МОНИТОР
; Пассивный RX — видит все пакеты (ARM и DISARM), показывает RSSI.
; Полезен для диагностики: видит и пилота и агрессора одновременно.
; ============================================================
[env:T3_S3_Monitor]
extends = env
build_flags =
    ${env.build_flags}
    -DROLE_MONITOR
    -DCONFIG_RADIO_OUTPUT_POWER=10
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=0
    ; Монитор использует расширенное окно приёма чтобы видеть и пилота и агрессора.
    ; Агрессор передаёт через ~10мс после пилота — стандартное окно 100мс его пропускает
    ; если якорь уехал. 150мс гарантирует приём обоих в одном слоте.
    -DRX_WINDOW_EXTRA_MS=150