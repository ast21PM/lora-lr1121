; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = lilygo-t3-s3
framework = arduino
monitor_speed = 115200
lib_deps = 
    ; ВОЗВРАТ К СТАБИЛЬНОЙ ВЕРСИИ: откат на версию, которая не вызывала проблем при установке.
    jgromes/RadioLib@^7.4.0
    ; Новые библиотеки для дисплея, как в эталонном проекте
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9

; ==================== ОБЩИЕ НАСТРОЙКИ РАДИО ====================
; Эти флаги применяются ко всем средам (Master и Slave)
; для гарантии совпадения параметров канала связи.
build_flags = 
  ; --- КРИТИЧЕСКИ ВАЖНЫЙ ФЛАГ для указания точной ревизии платы ---
  -D T3_S3_V1_2_LR1121

  ; --- Критически важные параметры для LoRa 2.4GHz ---
  -D CONFIG_RADIO_FREQ=2450.0         ; Частота в МГц (2.4 ГГц ISM-диапазон)
  -D CONFIG_RADIO_OUTPUT_POWER=13     ; Мощность в дБм (13 - максимум для HF-PA LR1121)
  
  ; --- Параметры для повышения надежности (синхронизированы с логами) ---
  ; ИСПРАВЛЕНИЕ: Возвращены параметры для максимальной надежности,
  ; которые решают проблему с приемом пакетов нулевой длины.
  ; Допустимые значения BW по даташиту: 406.3, 812.5, 1625.0
  -D CONFIG_RADIO_BW=406.3
  
  -D CONFIG_RADIO_SF=11               ; Spreading Factor. Увеличен для дальности и надежности.
  
  -D CONFIG_RADIO_CR=8                ; Coding Rate (4/8), максимальная помехозащита.
  -D CONFIG_RADIO_SYNC_WORD=0x12      ; Sync Word (должен быть одинаковый)
  -D CONFIG_RADIO_PREAMBLE=32         ; Длина преамбулы. 32 - хорошее значение для надежной синхронизации.

[env:T3_S3_LR1121_Master]
build_flags = 
  ${env.build_flags}
  -D ROLE_MASTER=1 ; Определяем роль как Master

[env:T3_S3_LR1121_Slave]
build_flags = 
  ${env.build_flags}
  -D ROLE_SLAVE=1  ; Определяем роль как Slave