[platformio]
default_envs = disarm_erls_monitor

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = printable, time
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
lib_deps =
    jgromes/RadioLib@^7.4.0
    olikraus/U8g2@^2.35.30
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -D T3_S3_V1_2_LR1121

; ============================================================
; 1. Проект: Disarm + ERLS (Simulation System v4.9)
; ============================================================
[env:disarm_erls_pilot]
extends = env
build_src_filter = +<disarm_erls/>
build_flags =
    ${env.build_flags}
    -I src/disarm_erls/include
    -DCONFIG_RADIO_FREQ=868.0
    -DCONFIG_RADIO_BW=500.0
    -DCONFIG_RADIO_SF=7
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=6
    -DBINDING_PHRASE=\"SECRET_PILOT_2026\"
    -DROLE_PILOT
    -DCONFIG_RADIO_OUTPUT_POWER=22
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=0
    -DDEVICE_ID=0xBB

[env:disarm_erls_drone]
extends = env
build_src_filter = +<disarm_erls/>
build_flags =
    ${env.build_flags}
    -I src/disarm_erls/include
    -DCONFIG_RADIO_FREQ=868.0
    -DCONFIG_RADIO_BW=500.0
    -DCONFIG_RADIO_SF=7
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=6
    -DBINDING_PHRASE=\"SECRET_PILOT_2026\"
    -DROLE_DRONE
    -DCONFIG_RADIO_OUTPUT_POWER=10
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=0
    -DPILOT_ID=0xBB

[env:disarm_erls_aggressor]
extends = env
build_src_filter = +<disarm_erls/>
build_flags =
    ${env.build_flags}
    -I src/disarm_erls/include
    -DCONFIG_RADIO_FREQ=868.0
    -DCONFIG_RADIO_BW=500.0
    -DCONFIG_RADIO_SF=7
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=6
    -DBINDING_PHRASE=\"SECRET_PILOT_2026\"
    -DROLE_AGGRESSOR
    -DCONFIG_RADIO_OUTPUT_POWER=18
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=10
    -DDEVICE_ID=0xAA

[env:disarm_erls_monitor]
extends = env
build_src_filter = +<disarm_erls/>
build_flags =
    ${env.build_flags}
    -I src/disarm_erls/include
    -DCONFIG_RADIO_FREQ=868.0
    -DCONFIG_RADIO_BW=500.0
    -DCONFIG_RADIO_SF=7
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=6
    -DBINDING_PHRASE=\"SECRET_PILOT_2026\"
    -DROLE_MONITOR
    -DCONFIG_RADIO_OUTPUT_POWER=10
    -DTX_INTERVAL_MS=20
    -DTX_SLOT_OFFSET_MS=0
    -DRX_WINDOW_EXTRA_MS=150

