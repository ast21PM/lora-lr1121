[env:lr_245_ghz_file_master]
extends = env
build_src_filter = +<lr_245_ghz_file/>
build_flags =
    ${env.build_flags}
    -I src/lr_245_ghz_file/include
    -DCONFIG_RADIO_FREQ=2450.0
    -DCONFIG_RADIO_OUTPUT_POWER=13
    -DCONFIG_RADIO_BW=406.3
    -DCONFIG_RADIO_SF=11
    -DCONFIG_RADIO_CR=8
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=32
    -DROLE_MASTER=1

