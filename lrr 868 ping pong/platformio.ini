

[platformio]
default_envs = T3_S3_LR1121_Master

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = printable
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
lib_deps = 
    jgromes/RadioLib@^7.1.2
    olikraus/U8g2@^2.35.30

[env:T3_S3_LR1121_Master]
extends = env
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DROLE_MASTER=1
    ; ===========================================
    ; Параметры LR1121 для 868 MHz (Sub-GHz)
    ; ===========================================
    -DCONFIG_RADIO_FREQ=868.0
    -DCONFIG_RADIO_OUTPUT_POWER=20
    -DCONFIG_RADIO_BW=125.0
    -DCONFIG_RADIO_SF=9
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=8

[env:T3_S3_LR1121_Slave]
extends = env
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DROLE_SLAVE=1
    ; ===========================================
    ; Параметры LR1121 для 868 MHz (Sub-GHz)
    ; ===========================================
    -DCONFIG_RADIO_FREQ=868.0
    -DCONFIG_RADIO_OUTPUT_POWER=20
    -DCONFIG_RADIO_BW=125.0
    -DCONFIG_RADIO_SF=9
    -DCONFIG_RADIO_CR=5
    -DCONFIG_RADIO_SYNC_WORD=0x12
    -DCONFIG_RADIO_PREAMBLE=8